<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>VKU Field Survey</title>

    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#0f766e" />

    <link rel="stylesheet" href="/style.css" />
  </head>

  <body>
    <main class="app">
      <header>
        <img src="/icons/icon-192.png" alt="VKU Survey" class="app-logo" />

        <p class="eyebrow">WEEK 4 — OFFLINE-FIRST DEMO</p>

        <h1>VKU Field Survey</h1>

        <p id="network-status" class="status"></p>
      </header>

      <section class="panel">
        <h2 id="form-title"></h2>

        <form id="survey-form"></form>
      </section>

      <section class="panel">
        <div class="section-header">
          <h2>Submissions trên thiết bị</h2>

          <div id="sync-counters" class="counters">
            <span id="pending-counter">Pending: 0</span>
            <span id="synced-counter">Synced: 0</span>
          </div>
          <button id="sync-button" type="button">Sync pending</button>
        </div>

        <div id="submission-list"></div>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
